[package]
name = "hp_tr_finder"
version = "0.6.2"
edition = "2024"
description = "Find homopolymers and tandem repeats in a FASTA file."
license = "MIT"
repository = "https://github.com/keithyin/hp_tr_finder"

[features]
cli = ["dep:clap", "dep:noodles-fasta"]

[dependencies]
regex = "1"
intervaltree = "0.2.7"
clap = { version = "4.6.6", features = ["derive"], optional = true }
noodles-fasta = { version = "0.68.0", optional = true }

[[bin]]
name = "hp_tr_finder"
path = "src/main.rs"
required-features = ["cli"]
