name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 静态链接,可在任意 glibc 版本的 Linux 上运行
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # macos-latest 为 arm64 原生 runner
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag v${tag_version} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="hp_tr_finder-v${version}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/hp_tr_finder" "$stage/"
          cp README.md "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"
          echo "ASSET=$stage.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SHA=$stage.tar.gz.sha256" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-cratesio:
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: |
          if [ -z "$CARGO_TOKEN" ]; then
            echo "::error::CARGO_TOKEN secret is not set. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          cargo publish --token "$CARGO_TOKEN"
